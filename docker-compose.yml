services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpago}
      POSTGRES_DB: ${POSTGRES_DB:-alpago}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpago}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alpago}:${POSTGRES_PASSWORD:-alpago}@db:5432/${POSTGRES_DB:-alpago}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
    ports:
      - "8000:8000"

  seed:
    build: ./backend
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-alpago}:${POSTGRES_PASSWORD:-alpago}@db:5432/${POSTGRES_DB:-alpago}
    command: ["python", "-m", "app.seed.seed"]
    restart: "no"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
