line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008",   # FastAPI Depends() in argument defaults is idiomatic
  "UP042",  # (str, Enum) is kept over StrEnum for stable SQLAlchemy/Pydantic behaviour
]

[lint.per-file-ignores]
"alembic/*" = ["E501", "F401"]
"tests/*" = ["E501"]
